schema = 1

# Guition / Shenzhen Jingcai JC3248W535 (JC3248W535EN, capacitive SKU
# JC3248W535C): ESP32-S3-WROOM-1 N16R8 with a 3.5-inch 320x480 AXS15231B panel
# on quad SPI. Display-only profile: the AXS15231B touch controller (I2C 0x3B)
# and TE line are not driven yet. GPIO38 receives one boot-time reset pulse.
[board]
id = "guition_jc3248w535"
name = "Guition JC3248W535 3.5-inch ESP32-S3 Display"
vendor = "Guition"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "esp32-s3-devkitc1-n16r8"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_axs15231b",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "gfx", "display_brightness",
  "cdc", "uart", "i2c", "spi", "wifi", "ble", "gpio", "adc", "pwm",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "expansion_uart",
  "expansion_adc", "expansion_pwm", "expansion_i2s", "key",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"AXS15231B"'
SOLAR_OS_BOARD_DISPLAY_DRIVER_NAME = '"axs15231b"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "480"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_QSPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "40000000U"
# MADCTL BGR bit only; AXS15231B rotation is done in software (U8G2_R1).
SOLAR_OS_BOARD_DISPLAY_MADCTL = "0x08"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R1"
SOLAR_OS_BOARD_DISPLAY_INVERT_COLOR = "0"
SOLAR_OS_BOARD_DISPLAY_FULL_FRAME = "0"
# QSPI transport: mode 0 + GPIO-driven CS like ESPHome mipi_spi (the vendor
# demo uses mode 3 with the peripheral CS: SPI_MODE "3", SOFTWARE_CS "0").
SOLAR_OS_BOARD_DISPLAY_SPI_MODE = "0"
SOLAR_OS_BOARD_DISPLAY_SOFTWARE_CS = "1"
# "1" sends the long vendor register table from the JC3248W535EN demo.
SOLAR_OS_BOARD_DISPLAY_VENDOR_INIT = "0"
# Bring-up aid: "1" shows red/green/blue/white full screens before the shell.
SOLAR_OS_BOARD_DISPLAY_SELF_TEST = "0"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_45"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_47"
SOLAR_OS_BOARD_PIN_LCD_D0 = "GPIO_NUM_21"
SOLAR_OS_BOARD_PIN_LCD_D1 = "GPIO_NUM_48"
SOLAR_OS_BOARD_PIN_LCD_D2 = "GPIO_NUM_40"
SOLAR_OS_BOARD_PIN_LCD_D3 = "GPIO_NUM_39"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_38"
SOLAR_OS_BOARD_PIN_LCD_TE = "GPIO_NUM_NC"
SOLAR_OS_BOARD_LCD_RESET_LOW_MS = "150U"
SOLAR_OS_BOARD_LCD_BACKLIGHT_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM_FREQ_HZ = "20000U"
SOLAR_OS_BOARD_SPI_HOST = "SPI3_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"HSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_11"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_4"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"

[runtime]
spi_hosts = []
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_0", "I2S_NUM_1"]

# microSD slot (SPI mode, schematic "SD_Car": IO10 CS, IO11 MOSI, IO12 CLK,
# IO13 MISO). No storage device is attached by this profile yet.
[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI3_HOST"
sclk = 12
miso = 13
mosi = 11
cs = [10]
max_transfer_size = 4096

# Touch controller bus (vendor esp_bsp.h: SDA 4, SCL 8). No touch driver yet.
[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 4
scl = 8
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "axs15231b"
name = "display0"
bindings = { clk = 47, d0 = 21, d1 = 48, d2 = 40, d3 = 39, cs = 45, reset = 38, bl = 1, active = 1, pwm = 1 }

[[pins]]
gpio = 0
policy = "fixed"
role = "BOOT/download / KEY"
[[pins]]
gpio = 1
policy = "fixed"
role = "LCD backlight PWM"
[[pins]]
gpio = 3
policy = "fixed"
role = "touch interrupt (TP_INT, not driven)"
[[pins]]
gpio = 4
policy = "fixed"
role = "I2C SDA (touch)"
expansion = true
[[pins]]
gpio = 5
policy = "fixed"
role = "battery sense divider (P2 header)"
[[pins]]
gpio = 6
policy = "free"
role = "P2 header"
expansion = true
user = true
adc = true
pwm = true
[[pins]]
