role = "microSD MISO"
[[pins]]
gpio = 14
policy = "free"
role = "P2 header"
expansion = true
user = true
adc = true
pwm = true
[[pins]]
gpio = 15
policy = "free"
role = "P2 header"
expansion = true
user = true
adc = true
pwm = true
[[pins]]
gpio = 16
policy = "free"
role = "P2 header"
expansion = true
user = true
adc = true
pwm = true
[[pins]]
gpio = 17
policy = "free"
role = "P3/P4 header"
expansion = true
user = true
adc = true
pwm = true
[[pins]]
gpio = 18
policy = "free"
role = "P3/P4 header"
expansion = true
user = true
adc = true
pwm = true
[[pins]]
gpio = 19
policy = "fixed"
role = "USB D-"
[[pins]]
gpio = 20
policy = "fixed"
role = "USB D+"
[[pins]]
gpio = 21
